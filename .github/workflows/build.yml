name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEVKITXENON: /usr/local/xenon
  # Same commit as the libxenon pin in scripts/build-deps.sh
  LIBXENON_SHA: c32c813c3d630ae922f83395ee4509b0468af71d

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison libgmp-dev libmpfr-dev libmpc-dev texinfo wget file

      # The GCC cross toolchain takes ~30 min to build, so it is cached.
      # restore/save are separate so the cache is kept even if a later step fails.
      - name: Restore xenon toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/xenon
          key: xenon-toolchain-${{ env.LIBXENON_SHA }}-v1

      - name: Build xenon toolchain (binutils + GCC + newlib)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p "$DEVKITXENON" && sudo chown "$USER" "$DEVKITXENON"
          git clone https://github.com/Free60Project/libxenon /tmp/libxenon
          git -C /tmp/libxenon checkout "$LIBXENON_SHA"
          cd /tmp/libxenon/toolchain
          PREFIX="$DEVKITXENON" ./build-xenon-toolchain toolchain || { tail -100 build.log; exit 1; }

      - name: Save xenon toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/xenon
          key: xenon-toolchain-${{ env.LIBXENON_SHA }}-v1

      - name: Build libraries (patched libxenon, ZLX, filesystems...)
        run: |
          sudo chown -R "$USER" "$DEVKITXENON"
          set -o pipefail
          scripts/build-deps.sh 2>&1 | tee deps.log

      - name: Build mupen64-360
        run: |
          export PATH="$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin"
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee make.log
          file mupen64-360.elf32

      # Surface the first errors as annotations so they show on the run page.
      - name: Report errors
        if: failure()
        run: |
          for f in deps.log make.log; do
            [ -f "$f" ] || continue
            grep -E "error|Error|No such file|undefined reference" "$f" | head -20 | while IFS= read -r l; do
              echo "::error title=$f::${l:0:900}"
            done
          done

      - name: Package USB folder
        run: scripts/package.sh mupen64-360.elf32 dist

      - uses: actions/upload-artifact@v4
        with:
          name: mupen64-360-usb
          path: dist/
